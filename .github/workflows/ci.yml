name: CI

on:
  push:
  pull_request:

jobs:
  shell-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Run installer and uninstaller tests
        run: bash tests/run.sh
